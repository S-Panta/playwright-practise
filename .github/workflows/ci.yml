name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
env:
  PYTHON_VERSION: "3.12.8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-python-dependency
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Print Python Location
        run: echo ${{ env.pythonLocation }}


      - name: build-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ github.run_id }}
      
          
  run-script:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: restore-build-cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ github.run_id }}

      - name: install playwright dependency
        run: |
          playwright install chromium

      - name: run-script
        run: |
          python script.py